name: ZN-M2

on:
  schedule:
    - cron: '47 19 * * *'   # Daily at 03:47 CST
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra config lines. Separate multiple lines with \n.'
        required: false
        type: string
      TEST:
        description: 'Generate the final config only, without compiling firmware.'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
    - uses: actions/cache/restore@v6
      id: cache-restore
      with:
        path: /tmp/passwall-cache
        key: passwall-check-
        restore-keys: passwall-check-

    - name: Check upstream updates
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        SHOULD_BUILD=false

        # Check Passwall release tag against this repo's latest release tag.
        # Our release tag is the Passwall version, so this needs no cache.
        LATEST_PW=$(gh release list -R Openwrt-Passwall/openwrt-passwall -L 1 --json tagName -q '.[0].tagName')
        LATEST_TAG=$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName -q '.[0].tagName' || echo "")
        if [ "$LATEST_PW" != "$LATEST_TAG" ]; then
          echo "Passwall release: ${LATEST_TAG:-none} -> $LATEST_PW"
          SHOULD_BUILD=true
        else
          echo "Passwall release unchanged ($LATEST_TAG)"
        fi

        # Check packages repo latest commit (cache tracks the last built SHA)
        LATEST_SHA=$(gh api repos/Openwrt-Passwall/openwrt-passwall-packages/commits/main --jq .sha)
        STORED_SHA=$(cat /tmp/passwall-cache/packages-sha 2>/dev/null || echo "")
        if [ "$LATEST_SHA" != "$STORED_SHA" ]; then
          echo "Packages: ${STORED_SHA:-none} -> $LATEST_SHA"
          SHOULD_BUILD=true
        else
          echo "Packages unchanged ($LATEST_SHA)"
        fi

        echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.check.outputs.should_build == 'true')
    name: ZN-M2
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ZN-M2-WIFI-NO
      WRT_THEME: argon
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: none
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}

  post-build:
    needs: [check, build]
    if: |
      always() &&
      needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - name: Publish firmware to new release
      if: inputs.TEST != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"

        # 1. Locate the release just created by WRT-CORE (tag prefix = WRT_CONFIG)
        WRT_TAG=$(gh release list -R "$REPO" --limit 10 --json tagName -q '.[].tagName' | grep '^ZN-M2-WIFI-NO-' | head -1)
        if [ -z "$WRT_TAG" ]; then
          echo "ERROR: WRT-CORE release not found"
          exit 1
        fi
        echo "WRT-CORE release: $WRT_TAG"

        # 2. Download its assets
        rm -rf /tmp/release-assets && mkdir -p /tmp/release-assets
        gh release download "$WRT_TAG" -R "$REPO" -D /tmp/release-assets

        # 3. Extract versions from manifest & config
        MANIFEST=$(find /tmp/release-assets -name '*.manifest' -print -quit)
        CONFIG=$(find /tmp/release-assets -name 'Config-*' -print -quit)
        PASSWALL_VER=$(grep luci-app-passwall "$MANIFEST" | awk -F" - " '{print $2}')
        XRAY_VER=$(grep xray-core "$MANIFEST" | awk -F" - " '{print $2}' | awk -F"-" '{print $1}')
        CHINADNS_VER=$(grep chinadns-ng "$MANIFEST" | awk -F" - " '{print $2}' | awk -F"-" '{print $1}')
        KERNEL_VER=$(grep -oP '^kernel - \K[\d\.]+' "$MANIFEST")
        TARGET=$(grep -m1 -oP '^CONFIG_TARGET_\K\w+(?==y)' "$CONFIG")

        if [ -z "$PASSWALL_VER" ]; then
          echo "ERROR: could not extract Passwall version from manifest"
          exit 1
        fi

        # 4. Custom release note
        cat <<EOF > /tmp/release-body.md
        ## ZN-M2 固件

        **Passwall 版本:** \`$PASSWALL_VER\`
        **Xray:** \`$XRAY_VER\`
        **ChinaDNS-NG:** \`$CHINADNS_VER\`

        登录地址：\`192.168.10.1\`
        登录密码：\`none\`
        内核版本：\`$KERNEL_VER\`
        配置：\`ZN-M2-WIFI-NO\`
        平台：\`$TARGET\`

        源码：https://github.com/VIKINGYFY/immortalwrt.git
        分支：\`main\`
        EOF

        # 5. (Re)create release using the Passwall version as the tag
        if gh release view "$PASSWALL_VER" -R "$REPO" >/dev/null 2>&1; then
          gh release delete "$PASSWALL_VER" -R "$REPO" --yes --cleanup-tag
        fi
        gh release create "$PASSWALL_VER" /tmp/release-assets/* -R "$REPO" \
          --title "ZN-M2 Passwall $PASSWALL_VER" --notes-file /tmp/release-body.md

        # 6. Remove the temporary WRT-CORE release & its tag
        gh release delete "$WRT_TAG" -R "$REPO" --yes --cleanup-tag

    # Save cache keyed by current upstream SHA, so each upstream change
    # creates a fresh cache entry and restore finds the most recent one.
    # A static key would be immutable in GitHub Actions and freeze the stored
    # SHA forever, causing a rebuild on every scheduled run.
    - name: Save cache for next check
      if: always() && inputs.TEST != 'true' && github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        PKG_SHA=$(gh api repos/Openwrt-Passwall/openwrt-passwall-packages/commits/main --jq .sha)
        mkdir -p /tmp/passwall-cache
        echo "$PKG_SHA" > /tmp/passwall-cache/packages-sha
        echo "CACHE_KEY=passwall-check-$PKG_SHA" >> $GITHUB_ENV

    - uses: actions/cache/save@v6
      if: always() && inputs.TEST != 'true' && github.event_name == 'schedule' && env.CACHE_KEY != ''
      with:
        path: /tmp/passwall-cache
        key: ${{ env.CACHE_KEY }}
